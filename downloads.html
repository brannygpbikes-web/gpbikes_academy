<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Downloads | GP Bikes Academy Ranked</title>

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="./style.css">

  <style>
    .download-item { border-bottom: 1px solid rgba(255,255,255,.07); }
    .download-item:last-child { border-bottom: 0; }

    .setup-toggle {
      width: 100%;
      border: 0;
      border-top: 1px solid rgba(255,255,255,.06);
      background: rgba(255,255,255,.025);
      color: #d1d5db;
      padding: 11px 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 9px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      text-align: left;
    }

    .setup-toggle:hover { background: rgba(255,255,255,.06); color: #fff; }
    .setup-toggle .setup-arrow { margin-left: auto; transition: transform .18s ease; }
    .setup-toggle.open .setup-arrow { transform: rotate(180deg); }

    .setup-panel {
      display: none;
      padding: 10px 18px 16px 58px;
      background: rgba(0,0,0,.12);
    }

    .setup-panel.open { display: block; }
    .setup-empty { color: #8f96a3; font-size: 13px; padding: 5px 0; }

    .setup-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,.06);
    }

    .setup-row:last-child { border-bottom: 0; }
    .setup-info { flex: 1; min-width: 0; }
    .setup-name { color: #fff; font-weight: 700; margin-bottom: 3px; }
    .setup-description { color: #9ca3af; font-size: 12px; }

    .setup-download {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 12px;
      border-radius: 4px;
      background: #b5161d;
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .setup-download:hover { background: #d11c24; }

    @media (max-width: 650px) {
      .setup-panel { padding-left: 18px; }
      .setup-row { align-items: flex-start; flex-direction: column; }
    }
  </style>

</head>

<body>

<header class="topbar">
  <div class="brand">
    <i class="fa-solid fa-flag-checkered"></i>
    <span>GP Bikes Academy Ranked</span>
  </div>
</header>

<nav class="sidebar">

  <a href="./index.html">
    <i class="fa-solid fa-trophy"></i>
    <span>Ranked</span>
  </a>

  <a href="./announcements.html">
    <i class="fa-solid fa-bullhorn"></i>
    <span>Announcements</span>
  </a>

  <a href="./downloads.html" class="active">
    <i class="fa-solid fa-download"></i>
    <span>Downloads</span>
  </a>

  <div class="sidebar-divider"></div>

  <a href="https://discord.gg/NGwKCQ96m8"
     target="_blank"
     rel="noopener noreferrer">

    <i class="fa-brands fa-discord"></i>
    <span>Join the Discord</span>
  </a>

</nav>

<main class="page">

  <div class="page-content">

    <div class="page-title">
      <div>
        <h1>Downloads</h1>
        <p>GP Bikes Academy files and resources</p>
      </div>
    </div>

    <section class="panel">

      <div class="panel-title">
        <div>
          <i class="fa-solid fa-box-open"></i>
          Available Downloads
        </div>
      </div>

      <div id="downloads">

        <div class="status-message">
          <i class="fa-solid fa-spinner fa-spin"></i>
          Loading downloads...
        </div>

      </div>

    </section>

  </div>

</main>

<script>
const DOWNLOADS_URL =
  "https://raw.githubusercontent.com/brannygpbikes-web/brannygpbikes.github.io/refs/heads/main/downloads.json";

async function loadDownloads() {
  const container = document.getElementById("downloads");

  try {
    const response = await fetch(
      DOWNLOADS_URL + "?v=" + Date.now(),
      {
        cache: "no-store"
      }
    );

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    container.innerHTML = "";

    if (!data.categories || data.categories.length === 0) {
      container.innerHTML = `
        <div class="status-message">
          No downloads available yet.
        </div>
      `;

      return;
    }

    data.categories.forEach(category => {
      const section = document.createElement("section");
      section.className = "download-section";

      const heading = document.createElement("div");
      heading.className = "download-category";

      heading.innerHTML = `
        <i class="${safeIcon(category.icon)}"></i>
        <span>${escapeHTML(category.name)}</span>
      `;

      section.appendChild(heading);

      const list = document.createElement("div");
      list.className = "download-list";

      if (!category.downloads || category.downloads.length === 0) {
        list.innerHTML = `
          <div class="status-message small">
            Nothing here yet.
          </div>
        `;
      } else {
        category.downloads.forEach(item => {
          const wrapper = document.createElement("div");
          wrapper.className = "download-item";

          const card = document.createElement("div");
          card.className = "download-card";

          card.innerHTML = `
            <div class="download-card-icon">
              <i class="${safeIcon(category.icon)}"></i>
            </div>

            <div class="download-details">
              <div class="download-name">
                ${escapeHTML(item.name)}
              </div>

              <div class="download-description">
                ${escapeHTML(item.description || "")}
              </div>
            </div>

            <a
              class="download-button"
              href="${safeURL(item.link)}"
              target="_blank"
              rel="noopener noreferrer"
            >
              <i class="fa-solid fa-download"></i>
              <span>Download</span>
            </a>
          `;

          wrapper.appendChild(card);

          const isBikeCategory =
            String(category.name || "").toLowerCase() === "bikes";

          if (isBikeCategory) {
            const setups = Array.isArray(item.setups) ? item.setups : [];

            const toggle = document.createElement("button");
            toggle.type = "button";
            toggle.className = "setup-toggle";
            toggle.innerHTML = `
              <i class="fa-solid fa-wrench"></i>
              <span>Setups (${setups.length})</span>
              <i class="fa-solid fa-chevron-down setup-arrow"></i>
            `;

            const panel = document.createElement("div");
            panel.className = "setup-panel";

            if (setups.length === 0) {
              panel.innerHTML =
                '<div class="setup-empty">No setups available yet.</div>';
            } else {
              setups.forEach(setup => {
                const row = document.createElement("div");
                row.className = "setup-row";

                row.innerHTML = `
                  <div class="setup-info">
                    <div class="setup-name">
                      ${escapeHTML(setup.name || "Setup")}
                    </div>
                    <div class="setup-description">
                      ${escapeHTML(setup.description || "")}
                    </div>
                  </div>

                  <a
                    class="setup-download"
                    href="${safeURL(setup.link)}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    <i class="fa-solid fa-download"></i>
                    <span>Download Setup</span>
                  </a>
                `;

                panel.appendChild(row);
              });
            }

            toggle.addEventListener("click", () => {
              toggle.classList.toggle("open");
              panel.classList.toggle("open");
            });

            wrapper.appendChild(toggle);
            wrapper.appendChild(panel);
          }

          list.appendChild(wrapper);
        });
      }

      section.appendChild(list);
      container.appendChild(section);
    });

  } catch (error) {
    console.error("Downloads error:", error);

    container.innerHTML = `
      <div class="status-message error-message">
        <i class="fa-solid fa-triangle-exclamation"></i>

        <strong>
          Downloads could not be loaded.
        </strong>

        <small>
          ${escapeHTML(error.message)}
        </small>
      </div>
    `;
  }
}

function escapeHTML(value) {
  const div = document.createElement("div");
  div.textContent = String(value ?? "");
  return div.innerHTML;
}

function safeIcon(value) {
  const icon = String(value || "fa-solid fa-download");

  if (/^[a-zA-Z0-9 _-]+$/.test(icon)) {
    return icon;
  }

  return "fa-solid fa-download";
}

function safeURL(value) {
  const url = String(value || "").trim();

  if (
    url.startsWith("https://") ||
    url.startsWith("http://")
  ) {
    return url;
  }

  return "#";
}

loadDownloads();
</script>

</body>
</html>
