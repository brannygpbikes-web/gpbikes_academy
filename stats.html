<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rider Stats | GP Bikes Academy Ranked</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./style.css">
  <style>
    .stats-search{position:relative;max-width:620px;margin-bottom:18px}
    .stats-search i{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#737b87}
    .stats-search input{width:100%;height:46px;padding:0 16px 0 43px;border:1px solid #343a44;border-radius:7px;background:#171a20;color:#fff;font:inherit;outline:none}
    .stats-search input:focus{border-color:#df252d}
    .matches{display:none;max-width:620px;margin-top:-12px;margin-bottom:18px;background:#171a20;border:1px solid #343a44;border-radius:7px;overflow:hidden}
    .match{padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.07);cursor:pointer}.match:last-child{border:0}.match:hover{background:rgba(255,255,255,.05)}
    .stats-hidden{display:none}
    .rider-heading{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}
    .rider-heading h2{margin:0;font-size:27px}.muted{color:#8b929d}
    .stat-cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:16px 0}
    .stat-card{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);border-radius:7px;padding:15px;text-align:center}
    .stat-card strong{display:block;font-size:23px}.stat-card span{display:block;margin-top:5px;color:#8b929d;font-size:11px;text-transform:uppercase}
    .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    .mini-stat{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);border-radius:6px;padding:12px}.mini-stat span{display:block;color:#8b929d;font-size:11px;text-transform:uppercase;margin-bottom:5px}
    .stats-columns{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
    .stats-table{width:100%;border-collapse:collapse}.stats-table th,.stats-table td{padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.07);text-align:left;font-size:13px}.stats-table th{color:#8b929d;font-size:11px;text-transform:uppercase}
    .subpanel{margin-top:18px}.subpanel-title{font-weight:bold;margin-bottom:13px}.subpanel-title i{color:#df252d;margin-right:7px}
    .race-row{display:grid;grid-template-columns:100px 1.5fr 1.2fr 65px 65px 70px;gap:8px;padding:10px 7px;border-bottom:1px solid rgba(255,255,255,.07);font-size:13px;align-items:center}.race-row.header{color:#8b929d;font-size:11px;text-transform:uppercase;font-weight:bold}
    .chartbox{height:260px;position:relative}.chart-empty{height:100%;display:flex;align-items:center;justify-content:center;color:#8b929d;text-align:center}
    #elo-canvas{width:100%;height:100%}
    @media(max-width:900px){.stat-cards{grid-template-columns:repeat(3,1fr)}.stats-grid{grid-template-columns:repeat(2,1fr)}.stats-columns{grid-template-columns:1fr}}
    @media(max-width:700px){.stat-cards{grid-template-columns:repeat(2,1fr)}.race-row{grid-template-columns:90px 1fr 65px}.race-row>*:nth-child(3),.race-row>*:nth-child(5),.race-row>*:nth-child(6){display:none}}

    /* Rider stats panel spacing fix */
    #profile { padding: 22px 24px 26px; }
    #loading { padding: 24px; }
    .rider-heading { margin-bottom: 4px; }
    .subpanel { padding-top: 4px; }
    .stats-columns .subpanel { min-width: 0; }
    .stats-table th:first-child,
    .stats-table td:first-child { padding-left: 4px; }
    .stats-table th:last-child,
    .stats-table td:last-child { padding-right: 4px; }
    @media(max-width:700px) {
      #profile { padding: 16px 14px 20px; }
    }
    /* Safety score - colour coded by grade */
    .profile-safety-score {
      font-size: 23px;
      font-weight: bold;
    }
    .profile-safety-score.safety-s { color: #008c2a; }
    .profile-safety-score.safety-a { color: #00e52b; }
    .profile-safety-score.safety-b { color: #a7e600; }
    .profile-safety-score.safety-c { color: #ffd21c; }
    .profile-safety-score.safety-d { color: #ff851b; }
    .profile-safety-score.safety-e { color: #ef3340; }
    .profile-safety-score.safety-none { color: #8b929d; }


  </style>
</head>
<body>
<header class="topbar"><div class="brand"><i class="fa-solid fa-flag-checkered"></i><span>GP Bikes Academy Ranked</span></div></header>
<nav class="sidebar">
  <a href="./index.html"><i class="fa-solid fa-trophy"></i><span>Ranked</span></a>
  <a href="./stats.html" class="active"><i class="fa-solid fa-chart-line"></i><span>Rider Stats</span></a>
  <a href="./announcements.html"><i class="fa-solid fa-bullhorn"></i><span>Announcements</span></a>
  <a href="./downloads.html"><i class="fa-solid fa-download"></i><span>Downloads</span></a>
  <div class="sidebar-divider"></div>
  <a href="https://discord.gg/NGwKCQ96m8" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-discord"></i><span>Join the Discord</span></a>
</nav>
<main class="page"><div class="page-content">
  <div class="page-title"><div><h1>Rider Stats</h1><p>Search your GP Bikes in-game name</p></div><div class="season-badge"><span class="live-dot"></span>2026 Season</div></div>
  <div class="stats-search"><i class="fa-solid fa-magnifying-glass"></i><input id="search" type="search" placeholder="Search your in-game name..." autocomplete="off"></div>
  <div id="matches" class="matches"></div>
  <section class="panel"><div class="panel-title"><div><i class="fa-solid fa-chart-simple"></i> Rider Analytics</div><span id="panel-status">Select a rider</span></div>
    <div id="loading" class="status-message"><i class="fa-solid fa-spinner fa-spin"></i> Loading analytics...</div>
    <div id="profile" class="stats-hidden"></div>
  </section>
</div></main>
<script>
const BASE="https://raw.githubusercontent.com/brannygpbikes-web/brannygpbikes.github.io/refs/heads/main/";
let data=null,elo={},safety={},history={};
const esc=v=>{const d=document.createElement("div");d.textContent=String(v??"");return d.innerHTML};
const n=(v,d=1)=>v==null?"—":Number(v).toFixed(d).replace(/\.0$/,"");
const pos=v=>v==null?"—":v+({1:"st",2:"nd",3:"rd"}[v]||"th");
const lap=v=>{if(v==null)return"—";let m=Math.floor(v/60),s=v-m*60;return m?m+":"+s.toFixed(3).padStart(6,"0"):s.toFixed(3)+"s"};
function grade(v){v=Number(v||0);return v>=250?"S":v>=165?"A":v>=125?"B":v>=100?"C":v>=70?"D":"E"}
function safetyBadge(v){
  if(v==null)return '<span class="profile-safety-score safety-none">—</span>';
  const g=grade(v);
  return `<span class="profile-safety-score safety-${g.toLowerCase()}">${v}</span>`;
}
function find(obj,name){if(!obj)return null;if(obj[name]!=null)return obj[name];const k=Object.keys(obj).find(k=>k.toLowerCase()===name.toLowerCase());return k?obj[k]:null}
async function j(name,opt=false){try{const r=await fetch(BASE+name+"?v="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error(name);return await r.json()}catch(e){if(opt)return{};throw e}}
(async()=>{try{[data,elo,safety,history]=await Promise.all([j("race_analytics.json"),j("elo_db.json",true),j("safety_db.json",true),j("elo_history.json",true)]);document.getElementById("loading").innerHTML='Search for a rider above.'}catch(e){document.getElementById("loading").innerHTML='<i class="fa-solid fa-triangle-exclamation"></i> race_analytics.json could not be loaded.'}})();
search.addEventListener("input",()=>{if(!data)return;let q=search.value.trim().toLowerCase(),m=document.getElementById("matches");if(!q){m.style.display="none";return}let a=data.riders.filter(x=>x.name.toLowerCase().includes(q)).slice(0,12);m.innerHTML=a.length?a.map(x=>`<div class="match" data-g="${esc(x.guid)}">${esc(x.name)} <span class="muted">• ${x.races} races</span></div>`).join(""):'<div class="match">No rider found</div>';m.style.display="block";m.querySelectorAll("[data-g]").forEach(x=>x.onclick=()=>show(x.dataset.g))});
search.addEventListener("keydown",e=>{if(e.key==="Enter"&&data){let q=search.value.trim().toLowerCase(),r=data.riders.find(x=>x.name.toLowerCase()===q)||data.riders.find(x=>x.name.toLowerCase().includes(q));if(r)show(r.guid)}});
function show(g){
 let r=data.riders.find(x=>x.guid===g);if(!r)return;search.value=r.name;matches.style.display="none";
 let e=find(elo,r.name),s=find(safety,r.name),ev=typeof e==="object"?e.elo:e,sv=typeof s==="object"?(s.safety??s.rating??s.score):s;
 let races=(data.races||[]).map(z=>{let rr=(z.riders||[]).find(y=>y.guid===g);return rr?{...rr,track:z.track,date:z.date}:null}).filter(Boolean).sort((a,b)=>new Date(b.date)-new Date(a.date));
 let tracks=Object.entries(r.tracks||{}).sort((a,b)=>b[1].races-a[1].races),bikes=Object.entries(r.bikes||{}).sort((a,b)=>b[1].races-a[1].races);
 profile.innerHTML=`<div class="rider-heading"><div><h2>${esc(r.name)}</h2><div class="muted">GP Bikes Academy rider profile</div></div></div>
 <div class="stat-cards"><div class="stat-card"><strong>${ev??"—"}</strong><span>Elo</span></div><div class="stat-card"><strong>${safetyBadge(sv)}</strong><span>Safety</span></div><div class="stat-card"><strong>${r.races}</strong><span>Races</span></div><div class="stat-card"><strong>${r.wins}</strong><span>Wins</span></div><div class="stat-card"><strong>${r.podiums}</strong><span>Podiums</span></div><div class="stat-card"><strong>${n(r.win_rate)}%</strong><span>Win rate</span></div></div>
 <div class="subpanel"><div class="subpanel-title"><i class="fa-solid fa-chart-line"></i>Elo History</div><div id="chart" class="chartbox"></div></div>
 <div class="subpanel"><div class="subpanel-title">Performance</div><div class="stats-grid">${mini("Podium rate",n(r.podium_rate)+"%")}${mini("Average finish",n(r.average_finish,2))}${mini("Average start",n(r.average_start,2))}${mini("Avg positions gained",n(r.average_positions_gained,2))}</div></div>
 <div class="subpanel"><div class="subpanel-title">Safety & Contacts</div><div class="stats-grid">${mini("Total contacts",r.contacts)}${mini("Contacts / race",n(r.contacts_per_race,2))}${mini("Clean races",r.clean_races)}${mini("Clean race %",n(r.clean_race_percent)+"%")}${mini("Worst severity",n(r.worst_contact_severity,2))}</div></div>
 <div class="stats-columns"><div class="subpanel"><div class="subpanel-title">Track Performance</div><table class="stats-table"><tr><th>Track</th><th>Races</th><th>Wins</th><th>Avg</th></tr>${tracks.map(([k,x])=>`<tr><td>${esc(k)}</td><td>${x.races}</td><td>${x.wins}</td><td>${n(x.average_finish,2)}</td></tr>`).join("")}</table></div>
 <div class="subpanel"><div class="subpanel-title">Bike Performance</div><table class="stats-table"><tr><th>Bike</th><th>Races</th><th>Wins</th><th>Podiums</th></tr>${bikes.map(([k,x])=>`<tr><td>${esc(k)}</td><td>${x.races}</td><td>${x.wins}</td><td>${x.podiums}</td></tr>`).join("")}</table></div></div>
 <div class="subpanel"><div class="subpanel-title">Race History</div><div class="race-row header"><div>Date</div><div>Track</div><div>Bike</div><div>Start</div><div>Finish</div><div>Contacts</div></div>${races.map(x=>`<div class="race-row"><div>${new Date(x.date).toLocaleDateString("en-GB")}</div><div>${esc(x.track)}</div><div>${esc(x.bike)}</div><div>${pos(x.start_position)}</div><div>${pos(x.finish_position)}</div><div>${x.contacts??0}</div></div>`).join("")}</div>`;
 loading.classList.add("stats-hidden");profile.classList.remove("stats-hidden");document.getElementById("panel-status").textContent=r.races+" races recorded";draw(r.name,ev)
}
function mini(a,b){return `<div class="mini-stat"><span>${a}</span><strong>${b}</strong></div>`}
function draw(name,current){
 let h=find(history,name)||[];if(!Array.isArray(h))h=[];if(!h.length&&current!=null)h=[{label:"Current",elo:Number(current)}];let box=document.getElementById("chart");
 if(h.length<2){box.innerHTML=`<div class="chart-empty">Current Elo: ${current??"—"}<br>Elo history will appear here as future races are recorded.</div>`;return}
 let c=document.createElement("canvas");c.id="elo-canvas";box.innerHTML="";box.appendChild(c);let d=window.devicePixelRatio||1,w=box.clientWidth,H=box.clientHeight;c.width=w*d;c.height=H*d;let x=c.getContext("2d");x.scale(d,d);let vs=h.map(z=>Number(z.elo)),mn=Math.min(...vs),mx=Math.max(...vs),pd=Math.max(10,(mx-mn)*.2);mn-=pd;mx+=pd;let L=48,R=15,T=15,B=35,W=w-L-R,HH=H-T-B;x.font="11px Arial";x.fillStyle="#8b929d";x.strokeStyle="rgba(255,255,255,.09)";for(let i=0;i<5;i++){let y=T+HH*i/4,v=mx-(mx-mn)*i/4;x.beginPath();x.moveTo(L,y);x.lineTo(w-R,y);x.stroke();x.fillText(Math.round(v),5,y+4)}let pts=h.map((z,i)=>({x:L+W*i/(h.length-1),y:T+(mx-Number(z.elo))/(mx-mn)*HH}));x.strokeStyle="#df252d";x.lineWidth=3;x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.stroke();x.fillStyle="#fff";pts.forEach(p=>{x.beginPath();x.arc(p.x,p.y,4,0,Math.PI*2);x.fill()})
}
</script></body></html>
